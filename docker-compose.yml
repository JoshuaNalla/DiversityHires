version: '3.8'

services:
  # MongoDB Container
  mongodb:
    image: mongo:latest
    container_name: intervai_mongodb
    ports:
      - "27017:27017" # Expose the internal port to the host
    volumes:
      - mongodb_data:/data/db # Persist your data across container restarts
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
    restart: unless-stopped

  # Placeholder for your teammate's MediaPipe Container
  # mediapipe:
  #   image: teammates_mediapipe_image
  #   container_name: intervai_mediapipe
  #   ports:
  #     - "5000:5000"

volumes:
  mongodb_data:
